name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
      - name: Verify tag and version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${version}"
          ./scripts/check-versions.sh
      - name: Build immutable artifact
        run: ./scripts/build-release.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == v0.* ]]; then
            gh release create "${GITHUB_REF_NAME}" build/sesamo.zip build/sesamo.zip.sha256 --verify-tag --generate-notes --prerelease --title "Sesamo ${GITHUB_REF_NAME#v}"
          else
            gh release create "${GITHUB_REF_NAME}" build/sesamo.zip build/sesamo.zip.sha256 --verify-tag --generate-notes --title "Sesamo ${GITHUB_REF_NAME#v}"
          fi
